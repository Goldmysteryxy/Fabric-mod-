name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only so tagged builds can attach the jar to a Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # Uses a pinned Gradle directly, so no gradle-wrapper.jar is needed in the repo.
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.4.1'

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: terminalmod-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Attach jar to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
